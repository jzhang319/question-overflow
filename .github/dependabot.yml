# Monthly dependency updates: security fixes are separate (automated security PRs).
# Minor/patch only and grouped, so old apps don't get breaking major upgrades.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      patch:
        update-types: ["patch"]
    ignore:
      # Flask 2.0.1 stack: minor bumps broke prod (itsdangerous 2.2 -> 500). Patch only.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "npm"
    directory: "/react-app"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
